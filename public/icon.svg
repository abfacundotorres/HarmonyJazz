<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="75%">
      <stop offset="0" stop-color="#f4e8c8"/>
      <stop offset="0.7" stop-color="#e6d3a2"/>
      <stop offset="1" stop-color="#d2b980"/>
    </radialGradient>
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="350">
      <stop offset="0" stop-color="#fbe49a"/>
      <stop offset="0.42" stop-color="#e3b04a"/>
      <stop offset="1" stop-color="#a8721b"/>
    </linearGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3a14"/>
      <stop offset="1" stop-color="#2b1a08"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#3a2410" flood-opacity="0.38"/></filter>
    <g id="piston" stroke="#3a2410" stroke-width="7" stroke-linejoin="round">
          <line x1="0" y1="190" x2="0" y2="204" stroke-width="8" stroke-linecap="round"/>
          <rect x="-12" y="204" width="24" height="86" rx="8" fill="url(#brass)"/>
          <rect x="-16" y="196" width="32" height="12" rx="6" fill="#f2c95e"/>
          <rect x="-15" y="286" width="30" height="11" rx="5" fill="#d8a23c"/>
          <circle cx="0" cy="182" r="10" fill="#fbf2d6"/>
    </g>
    <g id="tubos" fill="none">
          <path d="M104 256 H200"/>
          <path d="M318 268 V296 Q318 324 290 324 H156 Q116 324 116 290 Q116 258 156 258 H208"/>
          <path d="M200 256 H340"/>
    </g>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- rayos de sol, estilo cartel -->
    <g fill="#a67c33" opacity="0.13">
      <path d="M256 256 L-40 40 L-40 120Z"/><path d="M256 256 L-40 200 L-40 290Z"/><path d="M256 256 L-40 370 L-40 460Z"/>
      <path d="M256 256 L60 -40 L140 -40Z"/><path d="M256 256 L220 -40 L300 -40Z"/><path d="M256 256 L380 -40 L460 -40Z"/>
      <path d="M552 40 L256 256 L552 120Z"/><path d="M552 200 L256 256 L552 290Z"/><path d="M552 370 L256 256 L552 460Z"/>
      <path d="M60 552 L256 256 L140 552Z"/><path d="M220 552 L256 256 L300 552Z"/><path d="M380 552 L256 256 L460 552Z"/>
    </g>
    <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#9c7a3c" stroke-width="5" opacity="0.7"/>
    <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#9c7a3c" stroke-width="2" opacity="0.5"/>

    <g filter="url(#sombra)" transform="translate(256 250) rotate(-24) scale(1.14) translate(-256 -262)">
      <!-- tubos: contorno oscuro, latón y brillo -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <use href="#tubos" stroke="#3a2410" stroke-width="30"/>
        <use href="#tubos" stroke="url(#brass)" stroke-width="20"/>
        <use href="#tubos" stroke="#fff3c4" stroke-width="3" opacity="0.6" transform="translate(0 -5)"/>
      </g>
      <!-- campana -->
      <path d="M330 238 C376 234 404 208 428 160 L428 352 C404 304 376 278 330 274 Z" fill="url(#brass)" stroke="#3a2410" stroke-width="8" stroke-linejoin="round"/>
      <ellipse cx="428" cy="256" rx="20" ry="96" fill="url(#bore)" stroke="#3a2410" stroke-width="8"/>
      <ellipse cx="424" cy="256" rx="10" ry="74" fill="none" stroke="#f1c862" stroke-width="3" opacity="0.7"/>
      <!-- boquilla -->
      <path d="M96 246 h-18 q-18 0 -18 10 q0 10 18 10 h18z" fill="url(#brass)" stroke="#3a2410" stroke-width="7" stroke-linejoin="round"/>
      <!-- pistones -->
      <g stroke="#3a2410" stroke-width="7" stroke-linejoin="round">
        <use href="#piston" x="226"/>
        <use href="#piston" x="258"/>
        <use href="#piston" x="290"/>
      </g>
    </g>
  </g>
</svg>
